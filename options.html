<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; padding: 12px 16px; }
    label { display: block; margin: 6px 0; }
    h3 { margin: 12px 0 6px; font-size: 14px; }
  </style>
</head>
<body>
  <h3>After archiving or deleting, open:</h3>
  <label><input type="radio" name="direction" value="next"> The email below it (older, in a newest-first list)</label>
  <label><input type="radio" name="direction" value="previous"> The email above it (newer)</label>
  <h3>Troubleshooting</h3>
  <label><input type="checkbox" id="debug"> Log to the browser console</label>
  <script src="options.js"></script>
</body>
</html>
